name: Build Android APK and AAB

on:
  workflow_dispatch:
    inputs:
      app_name:
        required: false
        default: "Elitecare App"
      package_name:
        required: false
        default: "com.elitecare.app"
      version_name:
        required: false
        default: "1.0.0"
      version_code:
        required: false
        default: "1"
      build_type:
        required: false
        default: "both"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Android project
        run: |
          if [ ! -f build-input.zip ]; then
            echo "build-input.zip not found"
            exit 1
          fi

          rm -rf android-project
          mkdir android-project
          unzip -q build-input.zip -d android-project

      - name: Locate Gradle project
        run: |
          PROJECT=$(find android-project -name gradlew -type f | head -1)

          if [ -z "$PROJECT" ]; then
            echo "gradlew was not found."
            echo "The uploaded ZIP must contain a complete Android Gradle project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Show project
        run: |
          echo "Android project:"
          find "$PROJECT_DIR" -maxdepth 2 -type f | head -100

      - name: Build AAB
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew bundleRelease --no-daemon

      - name: Build APK
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' }}
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Upload AAB
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: Elitecare-AAB
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload APK
        if: ${{ github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: Elitecare-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
